[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sm120-sparse-attn"
version = "0.1.0"
description = "Dynamic block-sparse FP8/BF16 prefill attention kernels (CUTLASS CuTe DSL) and a vLLM hook for RTX PRO 6000 Blackwell (SM120)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.8",
  "nvidia-cutlass-dsl>=4.7.1",
  "cuda-python>=13.0",
]

[project.optional-dependencies]
vllm = ["vllm==0.30.0"]
eval = ["transformers>=4.57", "httpx>=0.27", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["sm120_attn*"]
